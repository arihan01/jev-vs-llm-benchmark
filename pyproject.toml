[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-vs-llm-benchmark"
dynamic = ["version"]
description = "Small, hand-inspectable benchmark of TypeSafe Jev vs LLMs on Choice / Score / Noul decisions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arihan" }]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=3.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pyyaml>=6",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "streamlit>=1.38",
  "plotly>=5.22",
  "python-dotenv>=1.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.16.10",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-jsonschema",
]
static = ["kaleido>=0.2"]

[project.urls]
"OpenRouter Jev docs" = "https://openrouter.ai/docs/guides/community/jev"

[project.scripts]
jev-bench = "bench.run:main"

[tool.setuptools]
packages = ["bench", "bench.adapters"]

[tool.setuptools.dynamic]
version = { attr = "bench.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# ✓ / ✗ / × in user-facing strings are intentional
allowed-confusables = ["×", "–", "’"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"dashboard/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=bench --cov-report=term-missing --cov-fail-under=85"
filterwarnings = [
  "error::DeprecationWarning:bench.*",
]

[tool.coverage.run]
branch = true
source = ["bench"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
